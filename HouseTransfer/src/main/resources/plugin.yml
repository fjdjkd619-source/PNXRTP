name: HouseTransfer
main: ru.leshaxarisha.housetransfer.HouseTransfer
version: "0.1.1"
api: "3.0.6"
load: POSTWORLD
author: Lesha x Arisha
description: Save and paste a house using PowerNukkitX structure NBT, including block-entity inventories.

commands:
  copy:
    aliases: [housecopy]
    description: Select, save and paste a house structure
    usage: /copy <pos1|pos2|info|save|paste>
    permission: housetransfer.admin

permissions:
  housetransfer.admin:
    description: Allows using HouseTransfer commands
    default: op
