name: R15 Stage 1-48 patch validation

on:
  push:
    branches: [R15]
    paths:
      - "PNX-Terra-stages1-36-unified-candidate/**"
      - ".github/workflows/r15-stage48-patch-check.yml"

permissions:
  contents: read

jobs:
  patch-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: R15
          path: candidate

      - name: Checkout pinned PowerNukkitX
        uses: actions/checkout@v4
        with:
          repository: PowerNukkitX/PowerNukkitX
          ref: c57499365737654eca32df008751ef6bca5af142
          path: pnx

      - name: Checkout pinned Terra 6.6.1
        uses: actions/checkout@v4
        with:
          repository: PolyhedralDev/Terra
          ref: 016961c19c41c2501737599175937ae40699beb1
          path: terra

      - name: Checkout pinned PNX-Terra adapter
        uses: actions/checkout@v4
        with:
          repository: PowerNukkitX-Bundle/PNX-Terra
          ref: 74318b4a1eae95322550f12d5eb8a76d92a93731
          path: adapter

      - name: Checkout pinned TerraOverworldConfig
        uses: actions/checkout@v4
        with:
          repository: PolyhedralDev/TerraOverworldConfig
          ref: 445848bc9f9f28fab1d760f01f9a552d93944681
          path: terra-config

      - name: Validate shell syntax and patch chain 1-48
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$GITHUB_WORKSPACE/candidate/PNX-Terra-stages1-36-unified-candidate"
          bash -n "$CANDIDATE/apply-stages1-48.sh"
          bash -n "$CANDIDATE/apply-stages1-47.sh"
          bash -n "$CANDIDATE/apply-stages1-46.sh"
          PNX_EXPECTED_REF=c57499365737654eca32df008751ef6bca5af142 \
            bash "$CANDIDATE/apply-stages1-48.sh" \
              --pnx "$GITHUB_WORKSPACE/pnx" \
              --terra "$GITHUB_WORKSPACE/terra" \
              --adapter "$GITHUB_WORKSPACE/adapter" \
              --pnx-ref c57499365737654eca32df008751ef6bca5af142
          git -C "$GITHUB_WORKSPACE/pnx" diff --check
          git -C "$GITHUB_WORKSPACE/terra" diff --check
          git -C "$GITHUB_WORKSPACE/adapter" diff --check
          echo "STAGE_1_48_PATCH_CHAIN=PASS"

      - name: Generate exact pinned ConfigPack inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/candidate/PNX-Terra-stages1-36-unified-candidate/validation/audit-terra-pack.py" \
            --root "$GITHUB_WORKSPACE/terra-config" \
            --expected-head 445848bc9f9f28fab1d760f01f9a552d93944681 \
            --output "$RUNNER_TEMP/terra-configpack-inventory.json"

      - name: Upload Stage 48 source inventory
        uses: actions/upload-artifact@v4
        with:
          name: stage48-terra-configpack-inventory
          path: ${{ runner.temp }}/terra-configpack-inventory.json
          if-no-files-found: error
          retention-days: 14
