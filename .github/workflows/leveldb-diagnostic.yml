name: LevelDB Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - leveldb-diagnostic

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract database and create isolated working copy
        run: |
          unzip -q leveldb-backup.zip -d extracted
          mkdir -p work
          cp -a extracted/db work/db
          # IQ80 LevelDB 0.12 expects the legacy .sst table suffix.
          # PNX stores identical table files with .ldb; add aliases only in the disposable copy.
          for file in work/db/*.ldb; do
            [ -e "$file" ] || continue
            cp "$file" "${file%.ldb}.sst"
          done
          echo "=== ORIGINAL ARCHIVE DATABASE FILES ==="
          find extracted/db -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort
          echo "=== WORKING COPY ==="
          du -sh work/db

      - name: Build LevelDB scanner
        timeout-minutes: 4
        run: |
          cd tools/leveldb-scan
          mvn -B -ntp -Dmaven.wagon.httpconnectionManager.ttlSeconds=20 package org.apache.maven.plugins:maven-dependency-plugin:3.7.1:build-classpath -Dmdep.outputFile=target/classpath.txt

      - name: Scan actual LevelDB records
        timeout-minutes: 2
        run: |
          java -cp "tools/leveldb-scan/target/classes:$(cat tools/leveldb-scan/target/classpath.txt)" \
            LevelDbChunkScanner "$PWD/work/db" "$PWD/leveldb-report.txt"
          echo "=== REPORT SHA256 ==="
          sha256sum leveldb-report.txt

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: leveldb-chunk-report
          path: leveldb-report.txt
