name: Build ChunkDiag
on:
  push:
    branches:
      - chunkdiag-1.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download PowerNukkitX 3.0.6 API jar
        run: |
          mkdir -p "$HOME/storage/downloads"
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://github.com/PowerNukkitX/PowerNukkitX/releases/download/3.0.6/powernukkitx.jar \
            -o "$HOME/storage/downloads/powernukkitx.jar"
          test -s "$HOME/storage/downloads/powernukkitx.jar"

      - name: Build diagnostic plugin
        run: |
          cd ChunkDiag
          mvn -B -ntp clean package
          test -s target/ChunkDiag-1.0.0.jar
          jar tf target/ChunkDiag-1.0.0.jar | grep -Fx 'plugin.yml'
          jar tf target/ChunkDiag-1.0.0.jar | grep -Fx 'ru/leshaxarisha/chunkdiag/ChunkDiag.class'

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ChunkDiag-1.0.0
          path: ChunkDiag/target/ChunkDiag-1.0.0.jar
          if-no-files-found: error
