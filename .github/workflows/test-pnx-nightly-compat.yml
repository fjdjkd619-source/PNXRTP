name: Test PNXRTP 1.5.0 against official PNX nightly
on:
  push:
    branches:
      - pnxrtp-1.5.0-dev

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PNXRTP 1.5.0 source
        uses: actions/checkout@v4
        with:
          ref: pnxrtp-1.5.0-dev

      - name: Set up Java 25 (compile plugin for Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Download official PNX nightly for Bedrock 1.26.60
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/storage/downloads"
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://github.com/PowerNukkitX/PowerNukkitX/releases/download/nightly/powernukkitx.jar \
            -o "$HOME/storage/downloads/powernukkitx.jar"
          echo "Expected official nightly SHA-256: 43573df79fb2c8b65af1349865412b040d12db5de834625893100a165953aaa2"
          echo "Downloaded JAR SHA-256:"
          sha256sum "$HOME/storage/downloads/powernukkitx.jar"
          test -s "$HOME/storage/downloads/powernukkitx.jar"

      - name: Compile PNXRTP 1.5.0 against nightly API
        shell: bash
        run: |
          set -euo pipefail
          cd PNXRTP
          mvn -B -ntp clean package
          test -s target/PNXRTP-1.5.0.jar
          jar tf target/PNXRTP-1.5.0.jar | grep -Fx 'plugin.yml'
          jar tf target/PNXRTP-1.5.0.jar | grep -Fx 'ru/leshaxarisha/pnxrtp/PNXRTP.class'
          jar tf target/PNXRTP-1.5.0.jar | grep -Fx 'ru/leshaxarisha/pnxrtp/OfflineChunkCleaner.class'
          jar tf target/PNXRTP-1.5.0.jar | grep -Fx 'ru/leshaxarisha/pnxrtp/OfflineChunkIntegrityScanner.class'
          jar tf target/PNXRTP-1.5.0.jar | grep -Fx 'ru/leshaxarisha/pnxrtp/OfflineWorldPurger.class'
          javap -verbose -classpath target/PNXRTP-1.5.0.jar ru.leshaxarisha.pnxrtp.PNXRTP | grep 'major version: 65'

      - name: Upload compatibility-test plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: PNXRTP-1.5.0-tested-against-PNX-nightly-1.26.60
          path: PNXRTP/target/PNXRTP-1.5.0.jar
          if-no-files-found: error
