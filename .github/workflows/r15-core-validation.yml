name: R15 full source-overlay validation

on:
  push:
    branches:
      - R15
    paths:
      - "PNX-Terra-stages1-36-unified-candidate/source/**"
      - "PNX-Terra-stages1-36-unified-candidate/tests/**"
      - "PNX-Terra-stages1-36-unified-candidate/patches/**"
      - "PNX-Terra-stages1-36-unified-candidate/validation/**"
      - ".github/workflows/r15-core-validation.yml"
  workflow_dispatch:

jobs:
  java21-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R15 branch tip
        uses: actions/checkout@v4
        with:
          ref: R15
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify shell scripts
        working-directory: PNX-Terra-stages1-36-unified-candidate
        run: |
          while IFS= read -r script; do bash -n "$script"; done < <(find . -name '*.sh' -type f | sort)
      - name: Parse every active patch
        working-directory: PNX-Terra-stages1-36-unified-candidate
        run: |
          while IFS= read -r patch; do
            echo "Checking $patch"
            git apply --stat "$patch" >/dev/null
          done < <(find patches -maxdepth 1 -name '*.patch' -type f | sort)
      - name: Apply Stage 37–42 patch to exact Stage 36 overlay baseline
        working-directory: PNX-Terra-stages1-36-unified-candidate
        run: bash validation/check-stage37-42-patch.sh
      - name: Checkout pinned PNX source for Stage 7/18 patch validation
        uses: actions/checkout@v4
        with:
          repository: PowerNukkitX/PowerNukkitX
          ref: c57499365737654eca32df008751ef6bca5af142
          path: pnx-pinned
      - name: Apply Stage 7 then rebased Stage 18 PNX patches
        run: |
          git -C pnx-pinned apply --check "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/07-stage7-core.patch"
          git -C pnx-pinned apply "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/07-stage7-core.patch"
          git -C pnx-pinned apply --check "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/11-stage11-pnx-durable-storage.patch"
          git -C pnx-pinned apply "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/11-stage11-pnx-durable-storage.patch"
          git -C pnx-pinned apply --check "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/18-stage18-pnx-core.patch"
          git -C pnx-pinned apply "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/18-stage18-pnx-core.patch"
          git -C pnx-pinned apply --check "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/22-stage22-pnx-spawner-delay.patch"
          git -C pnx-pinned apply "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/22-stage22-pnx-spawner-delay.patch"
          git -C pnx-pinned apply --check "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/35-pnx-entity-rollback-api.patch"
          git -C pnx-pinned apply "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/35-pnx-entity-rollback-api.patch"
          git -C pnx-pinned apply --check "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/36-pnx-deferred-entity-api.patch"
          git -C pnx-pinned apply "$GITHUB_WORKSPACE/PNX-Terra-stages1-36-unified-candidate/patches/36-pnx-deferred-entity-api.patch"
      - name: Compile and run platform-neutral regression suites
        working-directory: PNX-Terra-stages1-36-unified-candidate
        run: bash validation/run-core-tests.sh
      - name: Compile and run PNX delegate contract
        working-directory: PNX-Terra-stages1-36-unified-candidate
        run: bash validation/run-delegate-contract-compile.sh
      - name: Compile and run PNX BlockEntity contract
        working-directory: PNX-Terra-stages1-36-unified-candidate
        run: bash validation/run-pnx-be-contract-compile.sh
      - name: Compile and run runtime contract
        working-directory: PNX-Terra-stages1-36-unified-candidate
        run: bash validation/run-runtime-contract-compile.sh
      - name: Compile and run entity-spawn contract
        working-directory: PNX-Terra-stages1-36-unified-candidate
        run: bash validation/run-entity-spawn-contract-compile.sh
      - name: Check Stage 36 PNX API patch fixture
        working-directory: PNX-Terra-stages1-36-unified-candidate
        run: bash validation/run-stage36-pnx-api-patch-test.sh

  upstream-patch-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R15 candidate
        uses: actions/checkout@v4
        with:
          ref: R15
          path: candidate
          fetch-depth: 0
      - name: Checkout exact pinned PowerNukkitX
        uses: actions/checkout@v4
        with:
          repository: PowerNukkitX/PowerNukkitX
          ref: c57499365737654eca32df008751ef6bca5af142
          path: pnx
      - name: Checkout exact pinned Terra
        uses: actions/checkout@v4
        with:
          repository: PolyhedralDev/Terra
          ref: 05ddc8b8a66e17412670647cce78ef837b091256
          path: terra
      - name: Checkout exact pinned PNX-Terra adapter
        uses: actions/checkout@v4
        with:
          repository: PowerNukkitX-Bundle/PNX-Terra
          ref: 74318b4a1eae95322550f12d5eb8a76d92a93731
          path: adapter
      - name: Apply the complete Stage 1–42 patch chain to clean upstream checkouts
        run: |
          bash candidate/PNX-Terra-stages1-36-unified-candidate/apply-stages1-42.sh \
            --pnx "$GITHUB_WORKSPACE/pnx" \
            --terra "$GITHUB_WORKSPACE/terra" \
            --adapter "$GITHUB_WORKSPACE/adapter" \
            --pnx-ref c57499365737654eca32df008751ef6bca5af142
