name: R15 full Gradle build and JAR artifacts
# Rebuild with Beta8 camera source overlay and validated shell syntax.

on:
  workflow_dispatch:
  push:
    branches: [R15]

concurrency:
  group: r15-full-gradle-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-gradle-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout R15 candidate
        uses: actions/checkout@v4
        with:
          ref: R15
          path: candidate
          fetch-depth: 0

      - name: Checkout pinned PowerNukkitX
        uses: actions/checkout@v4
        with:
          repository: PowerNukkitX/PowerNukkitX
          ref: c57499365737654eca32df008751ef6bca5af142
          path: pnx

      - name: Checkout pinned Terra 6.6.1
        uses: actions/checkout@v4
        with:
          repository: PolyhedralDev/Terra
          ref: 016961c19c41c2501737599175937ae40699beb1
          path: terra

      - name: Checkout pinned PNX-Terra adapter
        uses: actions/checkout@v4
        with:
          repository: PowerNukkitX-Bundle/PNX-Terra
          ref: 74318b4a1eae95322550f12d5eb8a76d92a93731
          path: adapter

      - name: Checkout pinned TerraOverworldConfig
        uses: actions/checkout@v4
        with:
          repository: PolyhedralDev/TerraOverworldConfig
          ref: 445848bc9f9f28fab1d760f01f9a552d93944681
          path: terra-config

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Stage 49 content and generate certified bounds catalog
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$GITHUB_WORKSPACE/candidate/PNX-Terra-stages1-36-unified-candidate"
          bash "$CANDIDATE/content-pack/apply-fantasy-pack.sh" --terra-config "$GITHUB_WORKSPACE/terra-config"
          python3 "$CANDIDATE/validation/audit-terra-pack.py" \
            --root "$GITHUB_WORKSPACE/terra-config" \
            --expected-head 445848bc9f9f28fab1d760f01f9a552d93944681 \
            --pnx-root "$GITHUB_WORKSPACE/pnx" \
            --pnx-expected-head c57499365737654eca32df008751ef6bca5af142 \
            --output "$RUNNER_TEMP/terra-configpack-inventory.json"
          python3 -m pip install --user --disable-pip-version-check PyYAML
          python3 "$CANDIDATE/tools/generate_bounds_profiles.py" \
            --inventory "$RUNNER_TEMP/terra-configpack-inventory.json" \
            --source-root "$GITHUB_WORKSPACE/terra-config" \
            --output "$RUNNER_TEMP/OrigenBoundsCatalog.java" \
            | tee "$RUNNER_TEMP/bounds-profile-summary.json"
          install -D "$RUNNER_TEMP/OrigenBoundsCatalog.java" \
            "$CANDIDATE/source/org/powernukkitx/terra/crosschunk/bounds/OrigenBoundsCatalog.java"
          bash "$CANDIDATE/apply-stages1-48.sh" \
            --pnx "$GITHUB_WORKSPACE/pnx" \
            --terra "$GITHUB_WORKSPACE/terra" \
            --adapter "$GITHUB_WORKSPACE/adapter" \
            --pnx-ref c57499365737654eca32df008751ef6bca5af142

      - name: Compile and package Terra, PNX and adapter (tests deferred until Stage 50)
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            bash candidate/PNX-Terra-stages1-36-unified-candidate/validation/verify-upstream-build.sh \
              --pnx "$GITHUB_WORKSPACE/pnx" \
              --terra "$GITHUB_WORKSPACE/terra" \
              --adapter "$GITHUB_WORKSPACE/adapter" 2>&1 | tee "$RUNNER_TEMP/upstream-build-$attempt.log"
            result=${PIPESTATUS[0]}
            if [[ "$result" -eq 0 ]]; then exit 0; fi
            if ! grep -Eqi '429|Too Many Requests|502 Bad Gateway|503 Service Unavailable|504 Gateway Time-out' "$RUNNER_TEMP/upstream-build-$attempt.log"; then
              exit "$result"
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 30)); fi
          done
          exit 1

      - name: Run Stage 50 acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$GITHUB_WORKSPACE/candidate/PNX-Terra-stages1-36-unified-candidate"
          bash "$CANDIDATE/validation/run-stage50-acceptance.sh" \
            --candidate "$CANDIDATE" \
            --terra-config "$GITHUB_WORKSPACE/terra-config" \
            --pnx "$GITHUB_WORKSPACE/pnx" \
            --inventory "$RUNNER_TEMP/terra-configpack-inventory.json" \
            --bounds-catalog "$RUNNER_TEMP/OrigenBoundsCatalog.java" \
            --bounds-summary "$RUNNER_TEMP/bounds-profile-summary.json" \
            --output "$RUNNER_TEMP/stage50-acceptance.json" \
            2>&1 | tee "$RUNNER_TEMP/stage50-acceptance.log"

      - name: Collect built JARs
        if: success()
        run: |
          mkdir -p artifact-output/terra artifact-output/pnx artifact-output/adapter
          find terra/platforms/bukkit/common/build/libs -maxdepth 1 -type f -name '*shaded.jar' -exec cp -t artifact-output/terra {} +
          find pnx -type f -path '*/build/libs/*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp -t artifact-output/pnx {} +
          find adapter -type f -path '*/build/libs/*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp -t artifact-output/adapter {} +
          find artifact-output -type f -name '*.jar' -print
          test -n "$(find artifact-output -type f -name '*.jar' -print -quit)"

      - name: Assemble ConfigPack and release metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-output/content-pack/terra-overworld-fantasy
          cp -a terra-config/. artifact-output/content-pack/terra-overworld-fantasy/
          rm -rf artifact-output/content-pack/terra-overworld-fantasy/.git
          cp candidate/PNX-Terra-stages1-36-unified-candidate/content-pack/fantasy/manifest.json \
            artifact-output/content-pack/manifest.json
          cp "$RUNNER_TEMP/terra-configpack-inventory.json" artifact-output/content-pack/
          cp "$RUNNER_TEMP/bounds-profile-summary.json" artifact-output/content-pack/
          cp "$RUNNER_TEMP/stage50-acceptance.json" artifact-output/content-pack/
          cp "$RUNNER_TEMP/stage50-acceptance.log" artifact-output/content-pack/
          (
            cd artifact-output
            find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pnx-terra-r15-jars
          path: artifact-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
