name: Stages 1–25 integration gate

on:
  workflow_dispatch:
  push:
    branches:
      - worldgen/stages1-25
    paths:
      - 'worldgen/stages1-25/**'
      - '.github/workflows/stages1-25.yml'

permissions:
  contents: read

jobs:
  integration-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report current acceptance state
        shell: bash
        run: |
          cat worldgen/stages1-25/STATUS.md
          if grep -q 'Status: BLOCKED' worldgen/stages1-25/STATUS.md; then
            echo 'Stages 1–25 are not a complete integrated build.'
            echo 'The acceptance gate is intentionally closed until the complete upstream integration and runtime tests pass.'
            exit 1
          fi
          echo 'Status marker is clear. This gate alone does not replace the required full Gradle/integration workflow.'
