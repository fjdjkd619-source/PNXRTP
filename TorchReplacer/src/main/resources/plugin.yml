name: TorchReplacer
main: ru.leshaxarisha.torchreplacer.TorchReplacer
version: "0.1.0"
api: "3.0.6"
load: POSTWORLD
author: Lesha x Arisha
description: Replaces existing torch blocks with newly created block instances while preserving their states.

commands:
  torchreplace:
    description: Replace torches in saved chunks
    usage: /torchreplace <start|status|cancel> [world]
    permission: torchreplacer.admin

permissions:
  torchreplacer.admin:
    description: Allows replacing torches in worlds
    default: op
