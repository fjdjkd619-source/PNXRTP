id: FANTASY_CRYSTAL_CLUSTERS
type: FEATURE

distributor:
  type: AND
  distributors:
    - type: PADDED_GRID
      width: 48
      padding: 20
      salt: 48052
    - type: SAMPLER
      sampler:
        type: PROBABILITY
        sampler:
          type: OPEN_SIMPLEX_2
          salt: 48053
          frequency: 0.018
      threshold: 0.22

locator:
  type: AND
  locators:
    - type: RANDOM
      amount: 1
      height: &range
        min: ${meta.yml:bottom-y} + 12
        max: ${meta.yml:ocean-level} - 20
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SOLID
        offset: 0

structures:
  distribution:
    type: CONSTANT
  structures: fantasy_crystal_cluster
