id: FANTASY_UNDERGROUND_HALLS
type: FEATURE

distributor:
  type: PADDED_GRID
  width: 1536
  padding: 512
  salt: 48106

locator:
  type: AND
  locators:
    - type: RANDOM
      amount: 1
      height: &range
        min: ${meta.yml:bottom-y} + 24
        max: ${meta.yml:ocean-level} - 32
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SOLID
        offset: 0

structures:
  distribution:
    type: CONSTANT
  structures: fantasy_underground_hall
