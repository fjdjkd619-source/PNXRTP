name: PNXRTP
main: ru.leshaxarisha.pnxrtp.PNXRTP
version: 1.5.1
api: "3.0.6"
load: POSTWORLD
author: Lesha x Arisha
description: Safe random teleport and throttled chunk generation for PowerNukkitX

commands:
  rtp:
    description: Random safe teleport and protected chunk cleanup preview
    usage: /rtp [cleanup|purge]
    permission: pnxrtp.use
  rtpgen:
    description: Manage gradual world generation
    usage: /rtpgen <start|stop|pause|resume|status|radius|speed|world|region|preview|biome|schedule|autostart|performance|validate|exclude|diagnostics|dashboard|history|backup|map|reset>
    permission: pnxrtp.admin

permissions:
  pnxrtp.use:
    description: Allows random teleport
    default: true
  pnxrtp.admin:
    description: Allows managing PNXRTP and chunk generation
    default: op
  pnxrtp.cooldown.bypass:
    description: Bypasses the RTP cooldown
    default: op
