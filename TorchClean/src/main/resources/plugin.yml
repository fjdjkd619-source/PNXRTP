name: TorchClean
main: ru.leshaxarisha.torchclean.TorchClean
version: 0.1.0
api: "3.0.6"
load: POSTWORLD
author: Lesha x Arisha
description: Bounded scan and removal of decorative torches in the protected 441-chunk area

commands:
  torchclean:
    description: Scan or remove decorative torches in the configured area
    usage: /torchclean <scan|remove|status|stop>
    permission: torchclean.use

permissions:
  torchclean.use:
    description: Allows using TorchClean in the protected area
    default: op
