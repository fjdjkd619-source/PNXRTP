name: ChunkDiag
main: ru.leshaxarisha.chunkdiag.ChunkDiag
version: 1.0.0
api: "3.0.6"
load: POSTWORLD
author: Lesha x Arisha
description: Read-only diagnostics for loaded PowerNukkitX chunks

commands:
  chunkdiag:
    description: Read-only chunk generation and lighting diagnostics
    usage: /chunkdiag <area|here>
    permission: chunkdiag.use

permissions:
  chunkdiag.use:
    description: Allows running read-only chunk diagnostics
    default: op
