name: LightDiagnostics
main: ru.leshaxarisha.lightdiagnostics.LightDiagnostics
version: "0.3.0"
api: "3.0.6"
load: POSTWORLD
author: Lesha x Arisha
description: Read-only light and spawn-origin diagnostics for PowerNukkitX 3.0.6.

commands:
  lightdiag:
    description: Inspect light values and classify creature spawn origins
    usage: /lightdiag <probe|track|stats|export|help>
    permission: lightdiagnostics.admin

permissions:
  lightdiagnostics.admin:
    description: Allows using LightDiagnostics commands
    default: op
